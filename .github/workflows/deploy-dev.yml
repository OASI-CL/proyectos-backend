name: Deploy dev

# Rama develop -> ambiente dev.
#
#   push a develop     revisa, despliega, migra y verifica
#   pull request       solo revisa (nunca recibe credenciales de AWS)
#
# Configuración inicial (Environments, secretos, reglas de rama): infra/README.md

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch: {}

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  ENVIRONMENT: dev

jobs:
  check:
    name: Revisar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            infra/package-lock.json

      - name: Instalar
        run: |
          npm ci
          npm ci --prefix infra

      - name: Typecheck (API e infraestructura)
        run: |
          npm run build
          npm --prefix infra run build

      # Construye el paquete real de Lambda y lo prueba desde una copia fuera
      # del repo: detecta dependencias que quedaron en devDependencies, rutas
      # rotas y archivos .sql que no entraron al paquete.
      - name: Construir y probar el paquete de Lambda
        run: |
          npm run build:lambda
          npm run test:lambda

      - name: Sintetizar CloudFormation
        working-directory: infra
        run: npx cdk synth --quiet

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: dist-lambda-dev
          path: dist-lambda
          include-hidden-files: true
          retention-days: 7

  deploy:
    name: Desplegar dev
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: dev
    concurrency:
      group: deploy-dev
      cancel-in-progress: false # nunca cortar un deploy por la mitad
    permissions:
      contents: read
      id-token: write # OIDC: credenciales temporales, sin claves guardadas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            infra/package-lock.json

      - uses: actions/download-artifact@v4
        with:
          name: dist-lambda-dev
          path: dist-lambda

      - run: |
          npm ci
          npm ci --prefix infra

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Se nombran los stacks de este ambiente explícitamente (nunca --all):
      # la app de CDK siempre define los ocho stacks de los dos ambientes
      # (necesario para que las referencias entre stacks compartidos, como
      # Oasi-Database, se resuelvan bien — ver el comentario en bin/app.ts),
      # así que lo único que impide que un deploy de dev toque prod es no
      # nombrar sus stacks acá.
      - name: cdk deploy
        working-directory: infra
        run: |
          npx cdk deploy \
            Oasi-Network Oasi-Database Oasi-Auth-dev Oasi-Storage-dev Oasi-Api-dev \
            --require-approval never \
            --outputs-file outputs.json

      # Si la base de este ambiente es local (config.ts), no hay nada que
      # migrar en AWS: el paso se salta en vez de fallar.
      - name: Migraciones
        run: |
          MODE="$(npx tsx -e "import {CONFIG} from './infra/config'; process.stdout.write(CONFIG.${{ env.ENVIRONMENT }}.database.mode)")"
          echo "database.mode = $MODE"
          if [ "$MODE" = "local" ]; then
            echo "Base local: no hay migraciones que correr en AWS."
          else
            npm run db:migrate -- --env=${{ env.ENVIRONMENT }}
          fi

      # Un deploy verde tiene que significar "la API responde y llega a su
      # base", no solo "CloudFormation terminó".
      - name: Verificar que la API llegue a la base
        run: |
          API_URL="$(jq -r --arg s "Oasi-Api-${{ env.ENVIRONMENT }}" '.[$s].ApiUrl' infra/outputs.json)"
          API_URL="${API_URL%/}"   # la URL puede venir con o sin barra final
          echo "API: ${API_URL}"
          for intento in 1 2 3 4 5; do
            if curl -fsS "${API_URL}/health/db"; then echo; exit 0; fi
            echo " (intento ${intento} falló, reintentando)"; sleep 10
          done
          echo "::error::${API_URL}/health/db nunca respondió OK"
          exit 1
