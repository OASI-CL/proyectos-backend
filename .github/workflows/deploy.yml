name: Backend CI/CD

# develop  --push-->  checks, then deploy to dev
# main     --push-->  checks, then deploy to prod
# PR to develop or main  -->  checks only (never deploys, never gets AWS credentials)
#
# Each deploy: CDK deploy -> database migrations -> health check against the
# real database. The Lambda bundle is built and smoke-tested once, in `check`,
# and that exact artifact is what gets deployed.
#
# Setup (GitHub Environments, secrets, branch protection): DEPLOYMENT.md.

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch: {} # "Run workflow" re-deploys the selected branch

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  AWS_REGION: us-east-1

jobs:
  check:
    name: Type-check, build, smoke-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            infra/package-lock.json

      - name: Install
        run: |
          npm ci
          npm ci --prefix infra

      - name: Type-check API and infrastructure
        run: |
          npm run build
          npm --prefix infra run build

      - name: Build Lambda bundle
        run: npm run build:lambda

      - name: Smoke-test the bundle
        run: npm run test:lambda

      - name: Synthesize both environments
        working-directory: infra
        run: |
          npx cdk synth -c stage=dev --quiet
          npx cdk synth -c stage=prod --quiet

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: dist-lambda
          path: dist-lambda
          include-hidden-files: true
          retention-days: 7

  deploy:
    name: Deploy ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    needs: check
    if: github.event_name != 'pull_request' && (github.ref_name == 'develop' || github.ref_name == 'main')
    runs-on: ubuntu-latest
    # The environment is what the AWS role trusts (see infra/lib/account-stack.ts)
    # and where the prod approval rule lives.
    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    # Two pushes in a row deploy one after the other, never interleaved, and a
    # deploy in progress is never cancelled halfway.
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # OIDC: short-lived AWS credentials, no stored keys
    env:
      STAGE: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - uses: actions/download-artifact@v4
        with:
          name: dist-lambda
          path: dist-lambda

      - run: npm ci --prefix infra

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: CDK deploy
        working-directory: infra
        run: |
          npx cdk deploy "Oasi-Auth-${STAGE}" "Oasi-${STAGE}" \
            -c stage="${STAGE}" \
            --require-approval never \
            --outputs-file outputs.json

      - name: Database migrations
        run: bash scripts/db-ops.sh "${STAGE}" migrate

      - name: Health check (API -> database)
        run: |
          API_URL="$(jq -r --arg s "Oasi-${STAGE}" '.[$s].ApiUrl' infra/outputs.json)"
          echo "API: ${API_URL}"
          for attempt in 1 2 3 4 5; do
            if curl -fsS "${API_URL}health/db"; then echo; exit 0; fi
            echo " (attempt ${attempt} failed, retrying)"; sleep 10
          done
          echo "::error::${API_URL}health/db never answered OK"
          exit 1
